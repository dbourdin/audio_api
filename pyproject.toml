[tool.poetry]
name = "audio-api"
version = "0.3.0"
description = "Audio API built with FastAPI, DynamoDB and S3 integration"
authors = ["Damian Bourdin <damian.bourdin@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.10"
boto3 = "^1.35.92"
botocore = "^1.35.92"
click = "^8.1.8"
fastapi = "^0.115.6"
fastapi-utils = {extras = ["all"], version = "^0.8.0"}
python-multipart = "^0.0.20"
pydantic-settings = "^2.7.1"

[tool.poetry.group.dev.dependencies]
typer = "^0.9.0"
uvicorn = {extras = ["standard"], version = "^0.23.2"}


[tool.poetry.group.test.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
requests = "^2.31.0"
testcontainers = "^3.7.1"
testcontainers-localstack = "^0.0.1rc1"
httpx = "^0.25.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
manage = 'cli.manage:app'

[tool.isort]
profile = "black"
multi_line_output = 3
known_first_party = ["audio_api"]
default_section="THIRDPARTY"

[tool.pytest.ini_options]
addopts = "--cov audio_api --cov-report term-missing"
